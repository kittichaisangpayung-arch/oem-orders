{% extends "base.html" %}
{% block title %}ฟอร์มสาขา{% endblock %}
{% block content %}
<div class="card">
    <h2>{% if object %}แก้ไขสาขา{% else %}เพิ่มสาขา{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">บันทึก</button>
        <a href="{% url 'manage_data:store_list' %}">ยกเลิก</a>
    </form>
</div>
{% endblock %}
