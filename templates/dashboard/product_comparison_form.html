{% extends "base.html" %}
{% load humanize %}

{% block title %}เลือกสินค้าเพื่อเปรียบเทียบ{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <h2 class="mb-4">📊 เปรียบเทียบสินค้า</h2>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">เลือกสินค้าเพื่อเปรียบเทียบ (แนะนำ 2-6 สินค้า)</h5>
        </div>
        <div class="card-body">
            <form method="get" action="{% url 'dashboard:product_comparison' %}">
                <div class="mb-3">
                    <label class="form-label">ช่วงเวลา</label>
                    <select name="months" class="form-select" style="max-width: 200px;">
                        <option value="3" {% if months == 3 %}selected{% endif %}>3 เดือน</option>
                        <option value="6" {% if months == 6 %}selected{% endif %}>6 เดือน</option>
                        <option value="12" {% if months == 12 %}selected{% endif %}>12 เดือน</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">ค้นหาสินค้า</label>
                    <input type="text" id="productSearch" class="form-control" placeholder="พิมพ์เพื่อค้นหาสินค้า...">
                </div>

                <div class="row" id="productList" style="max-height: 500px; overflow-y: auto;">
                    {% for product in products %}
                    <div class="col-md-4 mb-2 product-item" data-search="{{ product.description|lower }} {{ product.barcode }}">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="products"
                                   value="{{ product.id }}" id="product{{ product.id }}">
                            <label class="form-check-label" for="product{{ product.id }}">
                                {% if product.image %}
                                <img src="{{ product.image.url }}" alt="" style="width: 24px; height: 24px; object-fit: cover; border-radius: 4px;">
                                {% endif %}
                                {{ product.description|truncatewords:6 }}
                                <br><small class="text-muted"><code>{{ product.barcode }}</code></small>
                            </label>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">เปรียบเทียบสินค้าที่เลือก</button>
                    <a href="{% url 'dashboard:product_trend_list' %}" class="btn btn-outline-secondary">ยกเลิก</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('productSearch').addEventListener('input', function(e) {
    const searchTerm = e.target.value.toLowerCase();
    const items = document.querySelectorAll('.product-item');

    items.forEach(function(item) {
        const searchData = item.getAttribute('data-search');
        if (searchData.includes(searchTerm)) {
            item.style.display = '';
        } else {
            item.style.display = 'none';
        }
    });
});
</script>
{% endblock %}
